[package]
name = "volamos-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library for volamos: CPU/memory abstractions and AmigaOS library emulation"

[dependencies]
# "jit" pulls in the crate's Cranelift-backed trace compiler for
# `CpuCore::run_batch`. Linked unconditionally (not a volamos-core cargo
# feature) so `--jit` is a single binary's runtime choice, matching every
# other CPU-shape flag (`--cpu`, `--fpu`) -- see `backend.rs`'s
# `M68kCpu::run` override and the CLI's `--jit`/`--no-jit` flags.
m68k = { version = "=0.11.6", features = ["jit"] }
# `bsdsocket.library`'s host-socket-passthrough backend (see
# `crate::bsdsocket`'s module docs): real, non-blocking BSD sockets via a
# cross-platform API, the same crate Copperline's own host-socket backend
# (`crates/hostsocket-plugin` in its repo) uses for the identical purpose.
socket2 = "0.5"
