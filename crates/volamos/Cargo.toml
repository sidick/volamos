[package]
name = "volamos"
version = "0.24.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "volamos: a Wine-style runtime for classic AmigaOS m68k CLI binaries"

[[bin]]
name = "volamos"
path = "src/main.rs"

[dependencies]
volamos-core = { workspace = true }
clap = { version = "4", features = ["derive"] }

# Opens the pseudo-terminal for tests/setmode_raw_e2e.rs (a unix-only test).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
