name: Homebrew formula

# The repository doubles as its own Homebrew tap (Formula/volamos.rb). Its
# url/sha256 are updated by hand after each release (see the formula's header
# and CONTRIBUTING.md), which is the error-prone step this workflow guards:
# a stale checksum, an unreachable tarball, deprecated formula syntax, or a
# mismatch between the formula's install steps and the tagged source archive
# all fail this job. Scoped to formula changes so it does not run on unrelated
# commits.
#
# It also runs weekly (and on demand), because the formula can go wrong
# without anyone touching it: a lagging bump after a release, or a tag whose
# tarball changed. The scheduled run re-audits online (so a checksum that no
# longer matches fails) and checks the formula is at the latest release.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/homebrew.yml"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/homebrew.yml"

concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Style and audit
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned to a commit: the action has no release tags.
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # main, 2026-11-06

      - name: Style
        run: brew style "$GITHUB_WORKSPACE/Formula/volamos.rb"

      - name: Audit
        # Tap the checked-out commit by name, trust it as users must (Homebrew
        # 7 refuses to load formulae from a tap nobody has trusted), then audit
        # it. --online checks that the release tarball is reachable and its
        # sha256 matches; this is the part `brew style` alone cannot catch.
        run: |
          brew tap sidick/volamos "$GITHUB_WORKSPACE"
          brew trust sidick/volamos
          brew audit --strict --online sidick/volamos/volamos

      - name: Install from source
        # Audit validates metadata but does not execute `def install`. Build
        # the stable release tarball so everything the formula copies is
        # checked against the archive users actually receive.
        run: brew install --build-from-source sidick/volamos/volamos

      - name: Test installed formula
        run: brew test sidick/volamos/volamos

  current:
    name: Formula is at the latest release
    # The release-please workflow opens the bump PR; this catches it failing
    # or sitting unmerged.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare with the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if ! grep -q "refs/tags/${latest}.tar.gz" Formula/volamos.rb; then
            echo "::error::Formula/volamos.rb is not at the latest release ${latest}: merge the bump PR or run tools/bump_homebrew_formula.sh (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "Formula/volamos.rb is at ${latest}"
