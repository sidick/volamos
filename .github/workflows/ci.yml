name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: ${{ runner.os }}
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  docs-build:
    name: Docs site (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install docs toolchain
        run: pip install -r tools/docs-requirements.txt

      - name: Strict MkDocs build
        run: mkdocs build --strict

  compare:
    name: Compare against vamos (two-oracle harness)
    runs-on: ubuntu-latest
    container: ghcr.io/sidick/amiga-dev:1
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: compare

      - name: Build volamos (release)
        run: cargo build --release -p volamos

      - name: Run comparison harness
        run: python3 tools/compare_vamos.py --volamos target/release/volamos

      - name: Run interpreter/--jit dual-mode harness
        run: python3 tools/compare_jit.py --volamos target/release/volamos

  docker:
    name: Docker image (build, validate, publish on tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: docker

      # Native build, used only as compare_docker.py's reference side --
      # never published.
      - name: Build native volamos (release)
        run: cargo build --release -p volamos

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-platform (runner-native) build, loaded locally so it can
      # actually run -- a multi-platform manifest built below can't be
      # `docker run` directly. This is what compare_docker.py exercises.
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: volamos:validate
          cache-from: type=gha,scope=volamos-docker-builder
          cache-to: type=gha,mode=max,scope=volamos-docker-builder

      - name: Validate container behavior against the native binary
        run: python3 tools/compare_docker.py --image volamos:validate --volamos target/release/volamos

      # Everything below only runs for a real release tag (v*) -- pull
      # requests and ordinary main-branch pushes stop at the validation
      # step above.
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sidick/volamos:${{ steps.tag.outputs.value }}
            ghcr.io/sidick/volamos:latest
          cache-from: type=gha,scope=volamos-docker-builder
          cache-to: type=gha,mode=max,scope=volamos-docker-builder

  # Standalone per-arch binary zips for users who don't want the Docker
  # image (issue #25, follow-up to #19). Each target builds in its own
  # parallel job rather than one cross-compiling environment -- the linux
  # musl builds reuse the Dockerfile's `builder` stage via buildx (same
  # static output #19 already produces, no separate cargo build), macOS
  # builds natively on an arm64 runner, and Windows cross-compiles with
  # mingw-w64 (confirmed working locally). Intel Mac is deliberately out
  # of scope -- no machine to validate it on.
  release-binaries-linux:
    name: Standalone binary (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/')
    # Waits on `docker` rather than running in parallel with it -- both
    # jobs build the same `builder` stage/platforms via the shared
    # volamos-docker-builder gha cache scope, but a cache written by one
    # job isn't visible to another job still running concurrently. Only
    # sequencing after `docker` (whose push step already builds+caches
    # both platforms) guarantees this job hits a warm cache instead of
    # independently recompiling everything from scratch.
    needs: [test, docker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract static binary from the Dockerfile's builder stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=volamos-docker-builder
          cache-to: type=gha,mode=max,scope=volamos-docker-builder

      - name: Package
        id: package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="volamos-${tag}-${{ matrix.target }}"
          mkdir "$name"
          cp "dist/volamos" "$name/"
          chmod +x "$name/volamos"
          tar czf "${name}.tar.gz" "$name"
          echo "path=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.target }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  release-binaries-macos:
    name: Standalone binary (aarch64-apple-darwin)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release-macos
          targets: aarch64-apple-darwin

      - name: Build (release)
        run: cargo build --release -p volamos --target aarch64-apple-darwin

      - name: Package
        id: package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="volamos-${tag}-aarch64-apple-darwin"
          mkdir "$name"
          cp target/aarch64-apple-darwin/release/volamos "$name/"
          tar czf "${name}.tar.gz" "$name"
          echo "path=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-aarch64-apple-darwin
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  release-binaries-windows:
    name: Standalone binary (x86_64-pc-windows-gnu)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release-windows
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build (release)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release -p volamos --target x86_64-pc-windows-gnu

      - name: Package
        id: package
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="volamos-${tag}-x86_64-pc-windows-gnu"
          mkdir "$name"
          cp target/x86_64-pc-windows-gnu/release/volamos.exe "$name/"
          zip -r "${name}.zip" "$name"
          echo "path=${name}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-x86_64-pc-windows-gnu
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  release-publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release-binaries-linux
      - release-binaries-macos
      - release-binaries-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packaged binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true

      - name: Create or update the release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          fi
