name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  docs-build:
    name: Docs site (strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install docs toolchain
        run: pip install -r tools/docs-requirements.txt

      - name: Strict MkDocs build
        run: mkdocs build --strict

  compare:
    name: Compare against vamos (two-oracle harness)
    runs-on: ubuntu-latest
    container: ghcr.io/sidick/amiga-dev:1
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compare-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            compare-cargo-

      - name: Build volamos (release)
        run: cargo build --release -p volamos

      - name: Run comparison harness
        run: python3 tools/compare_vamos.py --volamos target/release/volamos

      - name: Run interpreter/--jit dual-mode harness
        run: python3 tools/compare_jit.py --volamos target/release/volamos

  docker:
    name: Docker image (build, validate, publish on tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: docker-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            docker-cargo-

      # Native build, used only as compare_docker.py's reference side --
      # never published.
      - name: Build native volamos (release)
        run: cargo build --release -p volamos

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Single-platform (runner-native) build, loaded locally so it can
      # actually run -- a multi-platform manifest built below can't be
      # `docker run` directly. This is what compare_docker.py exercises.
      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: volamos:validate

      - name: Validate container behavior against the native binary
        run: python3 tools/compare_docker.py --image volamos:validate --volamos target/release/volamos

      # Everything below only runs for a real release tag (v*) -- pull
      # requests and ordinary main-branch pushes stop at the validation
      # step above.
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        if: startsWith(github.ref, 'refs/tags/')
        id: tag
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sidick/volamos:${{ steps.tag.outputs.value }}
            ghcr.io/sidick/volamos:latest
