# Lints the PR title against Conventional Commits. This repo squash-merges
# with the PR title as the commit subject, and release-please derives
# version bumps and changelog entries from those subjects -- a title this
# check rejects would otherwise be invisible to the release process.
# Valid types and the full convention are documented in CONTRIBUTING.md.
#
# pull_request_target (not pull_request) so the check also runs with a
# usable token on PRs from forks; it never checks out or runs PR code.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
