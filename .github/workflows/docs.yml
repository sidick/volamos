# Publishes the versioned user-docs site via sidick/amiga-workflows' docs.yml
# (MkDocs Material + mike -> GitHub Pages, each release tag deploys as a
# named version plus the floating `latest` alias), same convention as
# sibling AmiSnap. Day-to-day docs edits on main do NOT deploy -- the site
# is refreshed at release time (PRs get a strict build check in ci.yml's
# docs-build job).
#
# The normal trigger for this is release-please.yml's own `docs` job,
# which calls this same reusable workflow directly once release-please
# has actually tagged a release -- not a tags:['v*'] push trigger here,
# since release-please creates tags with the default GITHUB_TOKEN and
# GitHub blocks a GITHUB_TOKEN-authored event from triggering other
# workflows. workflow_dispatch stays as the manual escape hatch: re-
# publishing a version after a docs-only fix, or a first publish ahead
# of a release.
#
# Live at https://sidick.github.io/volamos/.
#
# One-time repo setup (done): Settings -> Pages -> Source: "Deploy from a
# branch" / gh-pages / root -- mike commits the built site to gh-pages
# itself, it does not use the "GitHub Actions" Pages source.

name: Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. v1.0)'
        required: true

# A reusable workflow's own `permissions:` block can only narrow, never
# widen, what the calling job already has -- so this repo's own contents:
# write grant (mike pushes to gh-pages) has to be declared here too, not
# just relied on inside amiga-workflows/docs.yml.
permissions:
  contents: write

jobs:
  docs:
    uses: sidick/amiga-workflows/.github/workflows/docs.yml@6ad7098bebba603db43f7c9e25706fa9047eeddc # v1
    with:
      version: ${{ inputs.version }}
