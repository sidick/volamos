# Shared "install Rust toolchain + cache cargo" steps -- every ci.yml
# job used to hand-roll its own copy of this (dtolnay/rust-toolchain +
# actions/cache), differing only in targets/components/cache key.
# Requires actions/checkout to have already run in the calling job (a
# local composite action can't be resolved before the repo is checked
# out), and reads the toolchain version from rust-toolchain.toml in the
# repo root.

name: Rust setup
description: Install a Rust toolchain and cache cargo registry/target dirs.

inputs:
  cache-key:
    description: Prefix for the cargo cache key, to keep jobs' caches from colliding.
    required: true
  targets:
    description: Comma-separated extra compile targets to install (e.g. aarch64-apple-darwin).
    required: false
    default: ''
  components:
    description: Comma-separated rustup components to install (e.g. "clippy, rustfmt").
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The version lives in rust-toolchain.toml (the single source for CI and
    # local builds). The action's `stable` ref only picks the action's own
    # revision; `toolchain` below is what actually gets installed.
    - name: Read the pinned toolchain
      id: pin
      shell: bash
      run: |
        channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        test -n "$channel" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust (no extra targets)
      if: inputs.targets == ''
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}

    - name: Install Rust (with target)
      if: inputs.targets != ''
      uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ inputs.cache-key }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ inputs.cache-key }}-cargo-
